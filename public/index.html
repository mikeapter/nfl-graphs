<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f17" />
  <title>NFL Graphs</title>
  <link rel="preconnect" href="https://a.espncdn.com" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">🏈</span>
      <div>
        <h1>NFL Graphs</h1>
        <p class="sub">Powered by <a href="https://github.com/nflverse" target="_blank" rel="noopener">nflverse</a> data</p>
      </div>
    </div>
    <div class="controls">
      <label class="season-pick">
        <span>Season</span>
        <select id="season-select" aria-label="Season"></select>
      </label>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle light/dark theme"></button>
    </div>
  </header>

  <div class="searchbar">
    <svg class="search-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="global-search" list="search-options" placeholder="Search a player or team…" autocomplete="off" />
    <datalist id="search-options"></datalist>
    <button id="search-clear" class="search-clear" type="button" aria-label="Clear" hidden>✕</button>
  </div>

  <nav class="tabs" id="tabs" role="tablist">
    <button class="tab active" data-view="teams" role="tab">Teams</button>
    <button class="tab" data-view="players" role="tab">Players</button>
    <button class="tab" data-view="standings" role="tab">Standings &amp; Scores</button>
    <button class="tab" data-view="trends" role="tab">Team Trends</button>
    <button class="tab" data-view="college" role="tab">College</button>
    <button class="tab" data-view="tendencies" role="tab">Tendencies</button>
  </nav>

  <main id="main">
    <!-- Teams explorer -->
    <section class="view active" id="view-teams">
      <div class="view-head">
        <h2>Team Explorer</h2>
        <div class="builder">
          <div class="segmented" id="team-chart">
            <button class="seg active" data-type="scatter">Scatter</button>
            <button class="seg" data-type="bar">Bars</button>
            <button class="seg" data-type="heatmap">Heatmap</button>
          </div>
          <label class="ctl" data-role="x"><span>X axis</span><select id="team-x"></select></label>
          <label class="ctl" data-role="y"><span>Y axis</span><select id="team-y"></select></label>
          <label class="ctl" data-role="rank"><span>Rank by</span><select id="team-rank"></select></label>
          <label class="ctl" data-role="set"><span>Stat set</span><select id="team-set"></select></label>
          <label class="ctl"><span>Weeks</span><select id="team-wk-from"></select><span class="wk-dash">–</span><select id="team-wk-to"></select></label>
        </div>
        <div class="chips" id="team-heat-chips" hidden></div>
        <p class="hint" id="team-hint"></p>
      </div>
      <div class="chart-wrap"><div id="team-chart-el" class="chart tall"></div></div>
    </section>

    <!-- Players explorer -->
    <section class="view" id="view-players">
      <div class="view-head">
        <h2>Player Explorer</h2>
        <div class="builder">
          <div class="segmented" id="player-seasontype">
            <button class="seg active" data-st="reg">Regular</button>
            <button class="seg" data-st="post">Playoffs</button>
          </div>
          <div class="segmented" id="player-pos">
            <button class="seg active" data-pos="QB">QB</button>
            <button class="seg" data-pos="RB">RB</button>
            <button class="seg" data-pos="WR">WR</button>
            <button class="seg" data-pos="TE">TE</button>
            <button class="seg" data-pos="SKILL">All skill</button>
          </div>
          <div class="segmented" id="player-chart">
            <button class="seg active" data-type="bar">Bars</button>
            <button class="seg" data-type="scatter">Scatter</button>
            <button class="seg" data-type="heatmap">Heatmap</button>
          </div>
          <label class="ctl" data-role="rank"><span>Rank by</span><select id="player-rank"></select></label>
          <label class="ctl" data-role="x"><span>X axis</span><select id="player-x"></select></label>
          <label class="ctl" data-role="y"><span>Y axis</span><select id="player-y"></select></label>
          <label class="ctl" data-role="set"><span>Stat set</span><select id="player-set"></select></label>
          <label class="ctl chk"><input type="checkbox" id="player-qual" checked /><span>Qualified only</span></label>
          <label class="ctl"><span>Weeks</span><select id="player-wk-from"></select><span class="wk-dash">–</span><select id="player-wk-to"></select></label>
        </div>
        <div class="chips" id="player-heat-chips" hidden></div>
        <p class="hint" id="player-hint"></p>
      </div>
      <div class="chart-wrap"><div id="player-chart-el" class="chart tall"></div></div>
      <div class="table-wrap"><table id="player-table"></table></div>
    </section>

    <!-- Standings & Scores -->
    <section class="view" id="view-standings">
      <div class="view-head row">
        <div><h2>Standings</h2><p class="hint">Regular season. Sorted by win %, then point differential.</p></div>
        <button id="standings-save" class="save-btn" type="button">⬇ Save PNG</button>
      </div>
      <div class="divisions" id="divisions"></div>
      <div class="view-head">
        <h2>Scores</h2>
        <label class="ctl"><span>Week</span><select id="week-select" aria-label="Week"></select></label>
      </div>
      <div class="scores" id="scores"></div>
    </section>

    <!-- Trends -->
    <section class="view" id="view-trends">
      <div class="view-head">
        <h2>Team Trends</h2>
        <label class="ctl"><span>Team</span><select id="team-select" aria-label="Team"></select></label>
      </div>
      <div class="chart-wrap"><div id="trend-pd" class="chart"></div></div>
      <div class="chart-wrap"><div id="trend-epa" class="chart"></div></div>
    </section>

    <!-- Profile page -->
    <section class="view" id="view-profile">
      <div class="pagebar">
        <button class="ghost-btn" id="prof-back">← Back</button>
        <div class="pagebar-right">
          <label class="ctl" id="prof-compare-ctl"><span>Compare with</span><select id="prof-compare"></select></label>
          <button class="ghost-btn" id="prof-copy">🔗 Copy link</button>
          <button class="save-btn" id="prof-save">⬇ Save card</button>
        </div>
      </div>
      <div id="profile-body"></div>
      <div class="prof-grid">
        <div class="chart-wrap"><div id="prof-radar" class="chart"></div></div>
        <div class="chart-wrap">
          <div class="builder" id="prof-log-ctl"><label class="ctl"><span>Game log</span><select id="prof-log-stat"></select></label></div>
          <div id="prof-chart1" class="chart"></div>
        </div>
        <div class="chart-wrap" id="prof-chart2-wrap"><div id="prof-chart2" class="chart"></div></div>
      </div>
      <div id="prof-field-section" hidden></div>
    </section>

    <!-- College -->
    <section class="view" id="view-college">
      <div class="view-head">
        <h2>College Players</h2>
        <div class="builder">
          <div class="segmented" id="college-cat">
            <button class="seg active" data-cat="Passing">Passing</button>
            <button class="seg" data-cat="Rushing">Rushing</button>
            <button class="seg" data-cat="Receiving">Receiving</button>
          </div>
          <div class="segmented" id="college-class">
            <button class="seg active" data-cls="FBS">FBS</button>
            <button class="seg" data-cls="FCS">FCS</button>
            <button class="seg" data-cls="All">All</button>
          </div>
          <div class="segmented" id="college-scope">
            <button class="seg active" data-scope="National">National</button>
            <button class="seg" data-scope="Conference">Conference</button>
            <button class="seg" data-scope="Both">Both</button>
          </div>
          <label class="ctl" id="college-conf-ctl" hidden><span>Conference</span><select id="college-conf"></select></label>
          <label class="ctl"><span>Rank by</span><select id="college-rank"></select></label>
          <input id="college-filter" class="cfilter" placeholder="Filter by name…" autocomplete="off" />
        </div>
        <p class="hint" id="college-hint"></p>
      </div>
      <div class="chart-wrap"><div id="college-chart" class="chart tall"></div></div>
      <div class="table-wrap"><table id="college-table"></table></div>
    </section>

    <!-- Compare page -->
    <section class="view" id="view-compare">
      <div class="pagebar">
        <button class="ghost-btn" id="cmp-back">← Back</button>
        <div class="pagebar-right"><button class="ghost-btn" id="cmp-copy">🔗 Copy link</button></div>
      </div>
      <div class="cmp-pickers">
        <select id="cmp-a" aria-label="Compare A"></select>
        <span class="vs">vs</span>
        <select id="cmp-b" aria-label="Compare B"></select>
      </div>
      <div class="chart-wrap"><div id="cmp-radar" class="chart tall"></div></div>
      <div class="table-wrap"><table id="cmp-table"></table></div>
    </section>

    <!-- Tendencies -->
    <section class="view" id="view-tendencies">
      <div class="view-head">
        <h2>Tendencies</h2>
        <div class="builder">
          <label class="ctl"><span>Team</span><select id="tend-team"></select></label>
          <div class="segmented" id="tend-side">
            <button class="seg active" data-side="off">Offense</button>
            <button class="seg" data-side="def">Defense</button>
          </div>
          <label class="ctl"><span>Show</span><select id="tend-metric"></select></label>
          <div class="segmented" id="tend-break">
            <button class="seg active" data-break="down">By down</button>
            <button class="seg" data-break="dist">By distance</button>
            <button class="seg" data-break="qtr">By quarter</button>
          </div>
          <label class="ctl"><span>Plays</span><select id="tend-ptype"><option value="">All plays</option><option value="1">Pass</option><option value="0">Run</option></select></label>
          <label class="ctl"><span>Game</span><select id="tend-game"></select></label>
        </div>
        <p class="hint" id="tend-hint"></p>
      </div>
      <div class="chart-wrap"><div id="tend-chart" class="chart tall"></div></div>
    </section>
  </main>

  <footer class="foot">
    <span id="updated"></span>
    <span>Built by <a href="https://twitter.com/mikeapter" target="_blank" rel="noopener">@mikeapter</a>
      · Data: nflverse · Logos: ESPN · Not affiliated with the NFL</span>
  </footer>

  <script src="./vendor/echarts.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
